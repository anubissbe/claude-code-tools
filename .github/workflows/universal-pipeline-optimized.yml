# Optimized Universal CI/CD Pipeline
# Designed to fix startup failures and reduce resource usage
# Self-hosted runners: 192.168.1.25 with controlled concurrency

name: 🚀 Universal CI/CD Pipeline (Optimized)

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      deploy_environment:
        description: 'Environment to deploy to'
        required: false
        default: 'staging'
        type: choice
        options:
        - staging
        - production

# Limit concurrent workflows to prevent runner overwhelm
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Use consistent runner labels
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  # Job 1: Quick Setup and Detection (lightweight)
  setup:
    name: 🔍 Setup & Detection
    runs-on: [self-hosted, linux, docker]
    timeout-minutes: 5
    outputs:
      project-type: ${{ steps.detect.outputs.project-type }}
      has-frontend: ${{ steps.detect.outputs.has-frontend }}
      has-backend: ${{ steps.detect.outputs.has-backend }}
      has-docker: ${{ steps.detect.outputs.has-docker }}
      language: ${{ steps.detect.outputs.language }}
      test-command: ${{ steps.detect.outputs.test-command }}
      build-command: ${{ steps.detect.outputs.build-command }}
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔍 Detect Project Type
        id: detect
        run: |
          echo "Starting project detection..."
          
          # Detect language and framework
          if [ -f "package.json" ]; then
            echo "language=javascript" >> $GITHUB_OUTPUT
            if grep -q "react" package.json; then
              echo "project-type=react" >> $GITHUB_OUTPUT
              echo "has-frontend=true" >> $GITHUB_OUTPUT
            elif grep -q "express" package.json; then
              echo "project-type=node" >> $GITHUB_OUTPUT
              echo "has-backend=true" >> $GITHUB_OUTPUT
            else
              echo "project-type=node" >> $GITHUB_OUTPUT
            fi
            echo "test-command=npm test" >> $GITHUB_OUTPUT
            echo "build-command=npm run build" >> $GITHUB_OUTPUT
          elif [ -f "requirements.txt" ] || [ -f "pyproject.toml" ]; then
            echo "language=python" >> $GITHUB_OUTPUT
            echo "project-type=python" >> $GITHUB_OUTPUT
            echo "test-command=pytest" >> $GITHUB_OUTPUT
            echo "build-command=python -m build" >> $GITHUB_OUTPUT
          else
            echo "language=unknown" >> $GITHUB_OUTPUT
            echo "project-type=generic" >> $GITHUB_OUTPUT
            echo "test-command=echo 'No tests configured'" >> $GITHUB_OUTPUT
            echo "build-command=echo 'No build configured'" >> $GITHUB_OUTPUT
          fi
          
          # Detect Docker
          if [ -f "Dockerfile" ] || [ -f "docker-compose.yml" ]; then
            echo "has-docker=true" >> $GITHUB_OUTPUT
          else
            echo "has-docker=false" >> $GITHUB_OUTPUT
          fi
          
          echo "✅ Project detection complete"

  # Job 2: Combined Quality & Security (reduce job count)
  quality-security:
    name: 🧹 Quality & Security
    runs-on: [self-hosted, linux, docker]
    needs: setup
    timeout-minutes: 15
    continue-on-error: true  # Don't fail entire pipeline on quality issues
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Setup Node.js
        if: needs.setup.outputs.language == 'javascript'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 🐍 Setup Python
        if: needs.setup.outputs.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          if [ "${{ needs.setup.outputs.language }}" = "javascript" ]; then
            npm ci || npm install
          elif [ "${{ needs.setup.outputs.language }}" = "python" ]; then
            python -m pip install --upgrade pip
            pip install -r requirements.txt || echo "No requirements.txt found"
          fi

      - name: 🧹 Linting
        continue-on-error: true
        run: |
          if [ "${{ needs.setup.outputs.language }}" = "javascript" ]; then
            npm run lint || npx eslint . || echo "No linting configured"
          elif [ "${{ needs.setup.outputs.language }}" = "python" ]; then
            pip install flake8 black isort
            flake8 . || echo "Flake8 failed, continuing..."
            black --check . || echo "Black formatting failed, continuing..."
            isort --check-only . || echo "Import sorting failed, continuing..."
          fi

      - name: 🎯 Type Checking
        continue-on-error: true
        run: |
          if [ "${{ needs.setup.outputs.language }}" = "javascript" ]; then
            npm run typecheck || npx tsc --noEmit || echo "No TypeScript checking"
          elif [ "${{ needs.setup.outputs.language }}" = "python" ]; then
            pip install mypy
            mypy . || echo "MyPy type checking failed, continuing..."
          fi

      - name: 🔒 Security Scan with Trivy
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'

  # Job 3: Testing (essential but lightweight)
  testing:
    name: 🧪 Testing
    runs-on: [self-hosted, linux, docker]
    needs: [setup]
    timeout-minutes: 20
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        if: needs.setup.outputs.language == 'javascript'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 🐍 Setup Python
        if: needs.setup.outputs.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          if [ "${{ needs.setup.outputs.language }}" = "javascript" ]; then
            npm ci || npm install
          elif [ "${{ needs.setup.outputs.language }}" = "python" ]; then
            python -m pip install --upgrade pip
            pip install -r requirements.txt || echo "No requirements.txt found"
            pip install pytest pytest-cov || echo "Test dependencies not available"
          fi

      - name: 🧪 Run Tests
        continue-on-error: true
        run: |
          echo "Running tests with command: ${{ needs.setup.outputs.test-command }}"
          ${{ needs.setup.outputs.test-command }} || echo "Tests failed or not configured, continuing..."

  # Job 4: Build (only if needed and successful tests)
  build:
    name: 🏗️ Build
    runs-on: [self-hosted, linux, docker]
    needs: [setup, testing]
    if: needs.setup.outputs.build-command != 'echo "No build configured"'
    timeout-minutes: 15
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        if: needs.setup.outputs.language == 'javascript'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 🐍 Setup Python
        if: needs.setup.outputs.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          if [ "${{ needs.setup.outputs.language }}" = "javascript" ]; then
            npm ci || npm install
          elif [ "${{ needs.setup.outputs.language }}" = "python" ]; then
            python -m pip install --upgrade pip
            pip install -r requirements.txt || echo "No requirements.txt found"
            pip install build || echo "Build tools not available"
          fi

      - name: 🏗️ Build Application
        run: |
          echo "Building with command: ${{ needs.setup.outputs.build-command }}"
          ${{ needs.setup.outputs.build-command }} || echo "Build failed, continuing..."

      - name: 📦 Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ github.run_id }}
          path: |
            dist/
            build/
            target/
            *.whl
            *.tar.gz
          retention-days: 3
          if-no-files-found: ignore

  # Job 5: Docker Build (only if Docker is detected)
  docker:
    name: 🐳 Docker Build
    runs-on: [self-hosted, linux, docker]
    needs: [setup, build]
    if: needs.setup.outputs.has-docker == 'true'
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Login to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-

      - name: 🏗️ Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Job 6: Deploy (only on main/master)
  deploy:
    name: 🚀 Deploy
    runs-on: [self-hosted, linux, docker]
    needs: [setup, testing, build]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    timeout-minutes: 10
    environment: 
      name: ${{ github.event.inputs.deploy_environment || 'staging' }}
    steps:
      - name: 🚀 Deploy Notification
        run: |
          echo "🚀 Deployment would happen here for ${{ github.event.inputs.deploy_environment || 'staging' }} environment"
          echo "Repository: ${{ github.repository }}"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"

  # Job 7: Cleanup (essential to prevent resource buildup)
  cleanup:
    name: 🧹 Cleanup
    runs-on: [self-hosted, linux, docker]
    needs: [setup, quality-security, testing, build, docker, deploy]
    if: always()
    timeout-minutes: 5
    steps:
      - name: 🧹 Docker Cleanup
        run: |
          # Clean up old Docker images and containers
          docker system prune -f --filter "until=24h" || echo "Docker cleanup failed, continuing..."
          
      - name: 🧹 Workspace Cleanup  
        run: |
          # Clean up workspace
          rm -rf node_modules/.cache || true
          rm -rf .pytest_cache || true
          rm -rf __pycache__ || true

